  <!-- ══ FLEET ══ -->

  </section>

  <!-- ══ CAREERS ══ -->

  <!-- ══ TECHNICAL ══ -->
  <section class="panel" id="technical" data-stop="7">

  <!-- ══ LIFE ON BOARD ══ -->

      <p class="eyebrow" data-i18n="life.eyebrow"></p>

      <p class="body" data-i18n="life.body"></p>

        <li data-i18n="life.point1"></li>
        <li data-i18n="life.point2"></li>
        <li data-i18n="life.point3"></li>
        <li data-i18n="life.point4"></li>
      </ul>
    </div>
  </section>

  <!-- ══ WELFARE ══ -->
  <section class="panel" id="welfare" data-stop="9">
    <div class="panel__inner panel__inner--wide">
      <p class="eyebrow" data-i18n="welfare.eyebrow"></p>
      <h2 data-i18n="welfare.title"></h2>
      <p class="body" data-i18n="welfare.body"></p>
      <div class="grid grid--4">
        <article class="card card--tight">
          <h3 data-i18n="welfare.point1.title"></h3>

  <!-- ══ PRE-SEA ══ -->
  <section class="panel" id="training" data-stop="10">
    <div class="panel__inner panel__inner--wide">
      <p class="eyebrow" data-i18n="training.eyebrow"></p>
      <h2 data-i18n="training.title"></h2>
      <p class="body" data-i18n="training.body"></p>

  <!-- ══ APPLY ══ -->
  <section class="panel" id="apply" data-stop="11">
    <div class="panel__inner panel__inner--form">
      <p class="eyebrow" data-i18n="apply.eyebrow"></p>
      <h2 data-i18n="apply.title"></h2>
      <p class="body" data-i18n="apply.body"></p>

      <form class="form" id="applyForm" novalidate>
        <div class="field">
          <label for="ap-name" data-i18n="apply.name"></label>
          <input id="ap-name" name="name" type="text" autocomplete="name" required />
          <small class="field__error" data-error-for="name"></small>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="ap-email" data-i18n="apply.email"></label>
            <input id="ap-email" name="email" type="email" autocomplete="email" required />
            <small class="field__error" data-error-for="email"></small>
          </div>
          <div class="field">
            <label for="ap-phone" data-i18n="apply.phone"></label>
            <input id="ap-phone" name="phone" type="tel" autocomplete="tel" required placeholder="+91…" />
            <small class="field__error" data-error-for="phone"></small>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="ap-department" data-i18n="apply.department"></label>
            <select id="ap-department" name="department" required></select>
            <small class="field__error" data-error-for="department"></small>
          </div>
          <div class="field">
            <label for="ap-rank" data-i18n="apply.rank"></label>
            <select id="ap-rank" name="rank" required></select>
            <small class="field__error" data-error-for="rank"></small>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="ap-vessel" data-i18n="apply.vessel"></label>
            <select id="ap-vessel" name="vesselType"></select>
          </div>
          <div class="field">
            <label for="ap-experience" data-i18n="apply.experience"></label>
            <input id="ap-experience" name="experience" type="text" placeholder="e.g. 18 months" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="ap-indos" data-i18n="apply.indos"></label>
            <input id="ap-indos" name="indos" type="text" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="ap-availability" data-i18n="apply.availability"></label>
            <input id="ap-availability" name="availability" type="date" />
          </div>
        </div>

        <div class="field">
          <label for="ap-cv" data-i18n="apply.cv"></label>
          <div class="dropzone" id="dropzone">
            <input id="ap-cv" name="cv" type="file" accept=".pdf,.doc,.docx,application/pdf" required />
            <span class="dropzone__text" id="dropzoneText">PDF, DOC or DOCX — up to 5 MB</span>
          </div>
          <small class="field__error" data-error-for="cv"></small>
        </div>

        <div class="field">
          <label for="ap-notes" data-i18n="apply.notes"></label>
          <textarea id="ap-notes" name="notes" rows="3"></textarea>
        </div>

        <label class="checkbox">
          <input id="ap-consent" name="consent" type="checkbox" required />
          <span data-i18n="apply.consent"></span>
        </label>
        <small class="field__error" data-error-for="consent"></small>

        <button class="btn btn--primary btn--block" type="submit" id="applySubmit" data-i18n="apply.submit"></button>
        <p class="form__legal" data-i18n="trust.noFeeBody"></p>
      </form>

      <div class="form-result" id="applyResult" hidden aria-live="polite"></div>
    </div>
  </section>

  <!-- ══ CONTACT ══ -->
  <section class="panel" id="contact" data-stop="12">
    <div class="panel__inner panel__inner--wide">

      <h2 data-i18n="contact.title"></h2>
      <p class="body" data-i18n="contact.body"></p>

      <div class="contact-grid">
        <form class="form form--compact" id="contactForm" novalidate>
          <div class="field">
            <label for="ct-name" data-i18n="contact.formName"></label>
            <input id="ct-name" name="name" type="text" required />
            <small class="field__error" data-error-for="name"></small>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="ct-email" data-i18n="contact.formEmail"></label>
              <input id="ct-email" name="email" type="email" required />
              <small class="field__error" data-error-for="email"></small>
            </div>
            <div class="field">
              <label for="ct-phone" data-i18n="contact.formPhone"></label>
              <input id="ct-phone" name="phone" type="tel" />
            </div>
          </div>
          <div class="field">
            <label for="ct-subject" data-i18n="contact.formSubject"></label>
            <input id="ct-subject" name="subject" type="text" />
          </div>
          <div class="field">
            <label for="ct-message" data-i18n="contact.formMessage"></label>
            <textarea id="ct-message" name="message" rows="4" required></textarea>
            <small class="field__error" data-error-for="message"></small>
          </div>
          <button class="btn btn--primary btn--block" type="submit" data-i18n="contact.formSubmit"></button>
          <div class="form-result" id="contactResult" hidden aria-live="polite"></div>
        </form>

        <aside class="offices">
          <h3 data-i18n="contact.offices"></h3>
          <ul id="officeList"></ul>
          <div class="offices__direct" id="directContact"></div>
        </aside>
      </div>

      <footer class="site-footer">
        <div class="site-footer__row">
          <p class="site-footer__brand">
            <strong>Edith Maritime Services Pvt Ltd</strong>
            <span data-i18n="footer.tagline"></span>
          </p>
          <p class="site-footer__legal" data-i18n="footer.legal"></p>
        </div>
        <p class="site-footer__copy">
          <span id="footerYear"></span> Edith Maritime Services Pvt Ltd. <span data-i18n="footer.rights"></span>
        </p>
      </footer>
    </div>
